<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <script src="../js/main.js" defer></script>
    <link rel="stylesheet" href="../style/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <aside>
        <main>
            <h2>Log in</h2>
            <form action="" method="post">
                <label for="email">
                    <div class="inputGroup">
                        <img src="../assets/images/email.svg" alt="email icon">
                        <input type="email" id="email" name="email" placeholder="Your email" required>
                    </div>
                </label>
                <label for="password">
                    <div class="inputGroup">
                        <img src="../assets/images/password.svg" alt="password icon">
                        <input type="password" id="password" name="password" placeholder="Your password" required>
                    </div>
                </label>
                <button id="signUp">
                    <p>Login</p>
                </button>
                <div class="forgot">
                    <a href="">forgot password?</a>
                </div>
                <div class="or">
                    <div class="line"></div>
                    <p>or</p>
                    <div class="line"></div>
                </div>
                <div class="loginWrapper">
                    <button>
                        <img src="../assets/images/googleIcon.svg" alt="google icon">
                        <p>google</p>
                    </button>
                    <button>
                        <img src="../assets/images/facebookIcon.svg" alt="facebook icon">
                        <p>facebook</p>
                    </button>
                </div>
                <div class="hasAnAccount">
                    <p>Don't have an account?</p>
                    <a href="../../index.html">Signup</a>
                </div>
            </form>
        </main>
    </aside>

    <img src="../assets/images/quarto.svg" alt="foto de uma quarto.svg dentro de um jarro com agua">
    <div class="signupPhrase">
        <img src="../assets/images/quotes.svg" alt="quotes image to make a little decoration">
        <h1>The only way to <span>do great work</span> is to <span>love what you do.</span></h1>
        <div class="steveJobs">
            <p>- Steve Jobs</p>
        </div>
    </div>
</body>
</html>
