<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <script src="./src/js/main.js" defer></script>
    <link rel="stylesheet" href="./src/style/signup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
        <img src="./src/assets/images/planta.svg" alt="foto de uma planta dentro de um jarro com agua">
    <div class="signupPhrase">
        <img src="./src/assets/images/quotes.svg" alt="quotes image to make a little decoration">
        <h1>The only way to <span>do great work</span> is to <span>love what you do.</span></h1>
        <div class="steveJobs">
            <p>- Steve Jobs</p>
        </div>
    </div>
    <aside>
        <main>
            <h2>Sign Up</h2>
            <form action="" method="post">
                <label for="email">
                    <div class="inputGroup">
                        <img src="./src/assets/images/email.svg" alt="email icon">
                        <input type="email" id="email" name="email" placeholder="Your email" required>
                    </div>
                </label>
                <label for="password">
                    <div class="inputGroup">
                        <img src="./src/assets/images/password.svg" alt="password icon">
                        <input type="password" id="password" name="password" placeholder="Your password" required>
                    </div>
                </label>
                <label for="password">
                    <div class="inputGroup">
                        <img src="./src/assets/images/password.svg" alt="password icon">
                        <input type="password" id="password" name="password" placeholder="repeat your password" required>
                    </div>
                </label>
                <button id="signUp">
                    <p>Sign Up</p>
                </button>
                <div class="or">
                    <div class="line"></div class="line">
                    <p>or</p>
                    <div class="line"></div class="line">
                </div>
            <div class="loginWrapper">
                <button>
                    <img src="./src/assets/images/googleIcon.svg" alt="google icon">
                    <p>google</p>
                </button>
                <button>
                    <img src="./src/assets/images/facebookIcon.svg" alt="facebook icon">
                    <p>facebook</p>
                </button>
            </div>
            <div class="hasAnAccount">
                <p>Already have an account? </p>
                <a href="./src/pages/login.html">Log in</a>
            </div>
            </form>
        </main>
    </aside>
</body>
</html>
